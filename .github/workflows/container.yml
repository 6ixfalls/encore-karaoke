name: Container

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Fork PRs can build and verify, but cannot publish with their read-only token.
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server and browser assets
        run: npm run build

      - name: Run lint and tests
        run: npm test

  build:
    name: Build and publish (${{ matrix.variant }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch-index-url: https://download.pytorch.org/whl/cpu
          - variant: gpu
            torch-index-url: https://download.pytorch.org/whl/cu128
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          # Keep existing unqualified tags as aliases for the CPU image.
          tags: |
            type=sha,prefix=sha-,format=short,suffix=-${{ matrix.variant }}
            type=ref,event=branch,suffix=-${{ matrix.variant }}
            type=ref,event=pr,suffix=-${{ matrix.variant }}
            type=raw,value=latest-${{ matrix.variant }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable=${{ matrix.variant == 'cpu' }}
            type=ref,event=branch,enable=${{ matrix.variant == 'cpu' }}
            type=ref,event=pr,enable=${{ matrix.variant == 'cpu' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'cpu' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          build-args: |
            TORCH_INDEX_URL=${{ matrix.torch-index-url }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=encore-container-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=encore-container-${{ matrix.variant }}
          provenance: ${{ env.PUSH_IMAGE == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH_IMAGE == 'true' }}

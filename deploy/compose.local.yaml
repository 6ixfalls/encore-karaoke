services:
  encore:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: encore-karaoke:local
    environment:
      PUBLIC_BASE_URL: http://localhost:3000
      SEPARATION_DEVICE: cpu
      SEPARATION_STORAGE_DIR: /var/cache/encore-media
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: ["/tmp:size=1200m,noexec,nosuid"]
    volumes:
      - encore-media:/var/cache/encore-media
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 6g
    cpus: 4
    pids_limit: 256

volumes:
  encore-media:

services:
  encore:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the trusted HTTPS origin}
      SEPARATION_DEVICE: ${SEPARATION_DEVICE:-cpu}
      FFMPEG_VIDEO_MODE: ${FFMPEG_VIDEO_MODE:-copy}
      FFMPEG_GPU: ${FFMPEG_GPU:-0}
      TRUSTED_PROXIES: ${ENCORE_PROXY_IP:-172.30.254.2}
    read_only: true
    # One prepared instrumental (capped at 1 GiB) plus processing scratch space.
    tmpfs: ["/tmp:size=1200m,noexec,nosuid"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 6g
    cpus: 4
    pids_limit: 256
    expose: ["3000"]
  proxy:
    image: caddy:2
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${ENCORE_PROXY_IP:-172.30.254.2}
    environment:
      KARAOKE_HOST: ${KARAOKE_HOST:?Set the hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      encore:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
networks:
  default:
    ipam:
      config:
        - subnet: ${ENCORE_NETWORK_SUBNET:-172.30.254.0/29}
